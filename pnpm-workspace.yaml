catalogMode: prefer
ignoreWorkspaceRootCheck: true
minimumReleaseAgeExclude:
  - '@types/node@25.9.0'
  - tsx@4.22.2
  - bumpp@12.0.0
shellEmulator: true
trustPolicy: no-downgrade

packages:
  - playground
  - docs
  - packages/*
  - examples/*

catalog:
  dsh-taiwind: 0.3.0

catalogs:
  cli:
    '@antfu/eslint-config': ^9.1.0
    '@antfu/ni': ^30.2.0
    bumpp: ^12.0.0
    eslint: ^10.7.0
    nano-staged: ^1.0.2
    publint: ^0.3.21
    simple-git-hooks: ^2.13.1
    skills-npm: ^1.2.0
    tsdown: ^0.22.12
    tsx: ^4.23.1
    typescript: ^6.0.3
    vite: ^8.1.5
  dsh:
    '@deepseek-ai/cordis': 4.0.5
    '@deepseek-ai/dsh-client-locale': 0.2.1-rc.4
    '@deepseek-ai/dsh-client-ui-layout': 0.2.1-rc.4
    '@deepseek-ai/dsh-client-ui-primitives': 0.2.1-rc.4
    '@deepseek-ai/dsh-client-ui-renderer': 0.2.1-rc.4
    '@deepseek-ai/dsh-client-ui-sidebar': 0.2.1-rc.4
    '@deepseek-ai/dsh-client-ui-slots': 0.2.1-rc.4
    '@deepseek-ai/dsh-host-webserver': 0.2.1-rc.4
  react:
    react: ^18.3.1
  testing:
    tsdown-stale-guard: ^0.1.3
    tsnapi: ^1.0.0
    vitest: ^4.1.10
  types:
    '@types/node': ^26.1.1
    '@types/react': ^18.3.12
    '@types/react-dom': ^18.3.1
allowBuilds:
  esbuild: true
  simple-git-hooks: true
